name: Setup
on:
  workflow_call:
    inputs:
      build-version:
        default: ""
        required: false
        type: string
    outputs:
      build-version:
        value: ${{ jobs.setup.outputs.version }}
      release-tag:
        value: ${{ jobs.setup.outputs.tag }}
permissions: {}
concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BUILD_VERSION: ${{ inputs.build-version }}
    outputs:
      version: ${{ steps.version.outputs.result }}
      tag: ${{ steps.tag.outputs.result }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        sparse-checkout: |-
          .aqua
          .github
          tasks
    - name: Setup aqua
      uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.64.0
    - name: Check valid version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash -euo pipefail {0}
      run: |-
        task version:check
    - name: Get build version
      id: version
      shell: bash -euo pipefail {0}
      run: echo "result=$(task build:version)" >> "$GITHUB_OUTPUT"
    - name: Get release tag
      id: tag
      env:
        BUILD_VERSION: ${{ steps.version.outputs.result }}
      shell: bash -euo pipefail {0}
      run: echo "result=$(task build:tag)" >> "$GITHUB_OUTPUT"
    - name: Restore setup build aqua cache
      id: aqua-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: aqua-${{ hashFiles('.aqua/pkgs/zig.yaml') }}
        path: ~/.local/share/aquaproj-aqua/
    - name: Fetch aqua tools
      shell: bash -euo pipefail {0}
      run: |-
        task tool:aqua:tag:zig
    - name: Save setup build aqua cache
      if: github.ref == 'refs/heads/main' && steps.aqua-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.aqua-cache-restore.outputs.cache-primary-key }}
        path: ~/.local/share/aquaproj-aqua/
