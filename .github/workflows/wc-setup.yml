name: Setup
on:
  workflow_call:
    inputs:
      build-version:
        default: ""
        required: false
        type: string
    outputs:
      build-version:
        value: ${{ jobs.setup.outputs.version }}
      release-tag:
        value: ${{ jobs.setup.outputs.tag }}
permissions: {}
concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BUILD_VERSION: ${{ inputs.build-version }}
    outputs:
      version: ${{ steps.version.outputs.result }}
      tag: ${{ steps.tag.outputs.result }}
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        persist-credentials: false
        sparse-checkout: |-
          .aqua
          .github
          tasks
    - name: Setup aqua
      uses: aquaproj/aqua-installer@ea518c135a02fc11ff8024364510c181a5c6b342 # v4.0.3
      with:
        aqua_version: v2.55.1
    - name: Check valid version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash -euo pipefail {0}
      run: |-
        task version:check
    - name: Get build version
      id: version
      shell: bash -euo pipefail {0}
      run: echo "result=$(task build:version)" >> "$GITHUB_OUTPUT"
    - name: Get release tag
      id: tag
      env:
        BUILD_VERSION: ${{ steps.version.outputs.result }}
      shell: bash -euo pipefail {0}
      run: echo "result=$(task build:tag)" >> "$GITHUB_OUTPUT"
    - name: Restore setup build aqua cache
      id: aqua-cache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: aqua-${{ hashFiles('.aqua/pkgs/zig.yaml') }}
        path: ~/.local/share/aquaproj-aqua/
    - name: Fetch aqua tools
      shell: bash -euo pipefail {0}
      run: |-
        task tool:aqua:tag:zig
    - name: Save setup build aqua cache
      if: github.ref == 'refs/heads/main' && steps.aqua-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        key: ${{ steps.aqua-cache-restore.outputs.cache-primary-key }}
        path: ~/.local/share/aquaproj-aqua/
